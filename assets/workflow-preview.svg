rif" font-size="15">Inspect styles, margins,</text><text x="32" y="338" fill="#334155" font-family="Arial, sans-serif" font-size="15">paragraph roles, colors.</text></g><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="4" d="M342 342 H438"/><path fill="#64748B" d="M438 342 l-15 -10 v20 z"/><g transform="translate(456 178)"><rect width="210" height="328" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2" rx="8"/><rect width="122" height="78" x="44" y="56" fill="#FFF" stroke="#34D399" stroke-width="2" rx="6"/><rect width="82" height="9" x="64" y="80" fill="#059669"/><rect width="58" height="8" x="64" y="104" fill="#94A3B8"/><path stroke="#10B981" stroke-linecap="round" stroke-width="9" d="M64 172 h82 m-82 24 h66 m-66 24 h92"/><circle cx="164" cy="216" r="28" fill="#059669"/><path fill="none" stroke="#FFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M151 216 l9 9 18 -22"/><text x="32" y="286" fill="#064E3B" font-family="Arial, sans-serif" font-size="20" font-weight="700">2. Repair</text><text x="32" y="314" fill="#334155" font-family="Arial, sans-serif" font-size="15">Build from template and</text><text x="32" y="338" fill="#334155" font-family="Arial, sans-serif" font-size="15">apply role-based format.</text></g><path fill="none" stroke="#64748B" stroke-linecap="round" stroke-width="4" d="M684 342 H780"/><path fill="#64748B" d="M780 342 l-15 -10 v20 z"/><g transform="translate(798 178)"><rect width="210" height="328" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2" rx="8"/><rect width="142" height="154" x="34" y="52" fill="#FFF" stroke="#FB923C" stroke-width="2" rx="6"/><text x="56" y="90" fill="#9A3412" font-family="Consolas, monospace" font-size="17">section []</text><text x="56" y="122" fill="#9A3412" font-family="Consolas, monospace" font-size="17">format []</text><text x="56" y="154" fill="#9A3412" font-family="Consolas, monospace" font-size="17">colors []</text><rect width="98" height="10" x="56" y="176" fill="#FDBA74"/><path stroke="#EA580C" stroke-linecap="round" stroke-width="8" d="M48 236 h114"/><text x="32" y="286" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20" font-weight="700">3. Validate</text><text x="32" y="314" fill="#334155" font-family="Arial, sans-serif" font-size="15">Run checker, dump map,</text><text x="32" y="338" fill="#334155" font-family="Arial, sans-serif" font-size="15">save JSON evidence.</text></g><g transform="translate(166 548)"><rect width="868" height="54" fill="#F1F5F9" stroke="#CBD5E1" rx="8"/><circle cx="30" cy="27" r="13" fill="#2563EB"/><circle cx="300" cy="27" r="13" fill="#059669"/><circle cx="574" cy="27" r="13" fill="#D97706"/><circle cx="824" cy="27" r="13" fill="#111827"/><text x="54" y="33" fill="#0F172A" font-family="Arial, sans-serif" font-size="16">template.docx</text><text x="324" y="33" fill="#0F172A" font-family="Arial, sans-serif" font-size="16">target.docx</text><text x="598" y="33" fill="#0F172A" font-family="Arial, sans-serif" font-size="16">format-report.json</text><text x="848" y="33" fill="#0F172A" font-family="Arial, sans-serif" font-size="16">pass</text></g></svg>